onclick="event.preventDefault();event.stopPropagation();">exportable</mark>, <mark class="link" title="#MindPage/core" onmousedown="_handleTagClick('YdDbsgF9h78OlcOHLoW1','#MindPage/core','extensible',event)" onclick="event.preventDefault();event.stopPropagation();">extensible</mark>, <a target="_blank" rel="opener" title="https://github.com/olcan/mind.page" href="https://github.com/olcan/mind.page" onclick="_handleLinkClick('YdDbsgF9h78OlcOHLoW1','https://github.com/olcan/mind.page',event)">open source</a>, and in <mark title="#beta" onmousedown="_handleTagClick('YdDbsgF9h78OlcOHLoW1','#beta','#beta',event)" onclick="event.preventDefault();event.stopPropagation();">beta</mark> stage. See also <a target="_blank" rel="opener" title="https://mind.page/?shared=y2swh7JY2ScO5soV7mJMHVltAOX2/intro" href="https://mind.page/?shared=y2swh7JY2ScO5soV7mJMHVltAOX2/intro" onclick="_handleLinkClick('YdDbsgF9h78OlcOHLoW1','https://mind.page/?shared=y2swh7JY2ScO5soV7mJMHVltAOX2/intro',event)">intro</a> by founder Olcan.</p>
